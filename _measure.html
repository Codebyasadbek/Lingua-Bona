<!doctype html><meta charset="utf-8">
<style>html,body{margin:0}iframe{border:0;display:block}</style>
<iframe id="f" scrolling="no"></iframe>
<script>
const q = new URLSearchParams(location.search);
const page = q.get('p'), W = +q.get('w'), SEL = q.get('s') || '';
const f = document.getElementById('f');
f.width = W; f.height = 200;
f.src = page;
f.onload = async () => {
  const d = f.contentDocument, win = f.contentWindow;
  await d.fonts.ready;
  f.height = d.documentElement.scrollHeight;
  const out = [];
  (SEL ? d.querySelectorAll(SEL) : []).forEach(el => {
    const r = el.getBoundingClientRect();
    const cs = win.getComputedStyle(el);
    out.push({
      c: (el.className && el.className.baseVal === undefined) ? String(el.className) : el.tagName,
      t: el.tagName,
      x: +r.x.toFixed(2), y: +r.y.toFixed(2), w: +r.width.toFixed(2), h: +r.height.toFixed(2),
      font: cs.fontFamily.split(',')[0].replace(/"/g,'') + ' ' + cs.fontWeight + ' ' + cs.fontSize + '/' + cs.lineHeight,
      ls: cs.letterSpacing, color: cs.color, bg: cs.backgroundColor,
      pad: cs.padding, gap: cs.gap, radius: cs.borderRadius,
      border: cs.borderTopWidth + ' ' + cs.borderTopColor, op: cs.opacity
    });
  });
  const pre = document.createElement('pre');
  pre.id = 'R';
  pre.textContent = JSON.stringify({ pageH: d.documentElement.scrollHeight, els: out });
  document.body.appendChild(pre);
};
</script>
